<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTDR Aurora — NOC Arroba</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--card:#111827;--border:#1e293b;--text:#e0e0e0;--muted:#475569;--red:#ef4444;--green:#22c55e;--orange:#f97316;--cyan:#67e8f9;--purple:#a855f7;--yellow:#fbbf24}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;overflow:hidden}
.hdr{background:#0f172a;padding:10px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hdr h1{font-size:15px;color:#f1f5f9;font-weight:600}
.hdr .sub{font-size:10px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:7px;padding:3px;border:1px solid var(--border)}
.tabs a{padding:4px 9px;border-radius:5px;font-size:11px;color:#64748b;text-decoration:none}
.tabs a:hover{color:#cbd5e1}
.tabs a.on{background:#7f1d1d;color:#fca5a5;font-weight:600}
#map{height:calc(100vh - 48px);width:100%;background:#1a1a2e}
.painel{position:absolute;top:58px;right:8px;width:340px;max-height:calc(100vh - 70px);background:var(--card);border:1px solid var(--border);border-radius:10px;z-index:1000;overflow-y:auto;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.sec{padding:12px 14px;border-bottom:1px solid var(--border)}
.sec:last-child{border-bottom:none}
.sec-t{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:8px}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.kp{background:#0f172a;border:1px solid var(--border);border-radius:7px;padding:8px 10px}
.kp .l{font-size:10px;color:var(--muted)}
.kp .v{font-size:20px;font-weight:700;color:#f1f5f9;line-height:1.1}
.kp .v.red{color:var(--red)}.kp .v.green{color:var(--green)}
.lr{display:flex;align-items:center;gap:7px;padding:3px 0;cursor:pointer;font-size:11px;color:#94a3b8}
.lr input{accent-color:#3b82f6;cursor:pointer}
.lr .d{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lr .ln{width:16px;height:3px;border-radius:2px;flex-shrink:0}
.rc{background:#0f172a;border-radius:7px;border:1px solid var(--border);overflow:hidden;margin-bottom:8px}
.rh{padding:8px 10px;cursor:pointer}.rh:hover{background:#1e293b}
.rt{font-size:12px;font-weight:600;color:#f1f5f9;display:flex;justify-content:space-between;align-items:center}
.rb{font-size:10px;font-weight:700;padding:2px 7px;border-radius:12px}
.rb.pon{background:#7f1d1d;color:#fca5a5}.rb.cto{background:#7c2d12;color:#fed7aa}
.rsub{font-size:10px;color:#64748b;margin-top:3px}
.rb2{padding:0 10px 10px;display:none;border-top:1px solid var(--border)}.rb2.open{display:block}
.ir{display:flex;justify-content:space-between;padding:3px 0;font-size:11px}
.ir .il{color:var(--muted)}.ir .iv{color:#cbd5e1;font-weight:500}.ir .iv.red{color:var(--red)}.ir .iv.cy{color:var(--cyan)}
.cl{font-size:10px;color:#94a3b8;padding:2px 0 2px 8px;border-left:2px solid #334155;margin-top:2px}
.cl .lg{color:#cbd5e1;font-weight:500}.cl .hr{color:var(--cyan)}
.ax{margin-top:8px;padding:8px;background:#1e293b;border-radius:6px;border-left:3px solid var(--red);font-size:11px;line-height:1.5;color:#f1f5f9}
.bl{width:100%;margin-top:8px;padding:6px;background:#1d4ed8;border:none;border-radius:5px;color:#fff;font-size:11px;cursor:pointer;font-weight:600}
.bl:hover{background:#2563eb}
.ld{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--border);padding:20px 30px;border-radius:10px;text-align:center;z-index:2000}
.sp{border:3px solid var(--border);border-top:3px solid #3b82f6;border-radius:50%;width:28px;height:28px;animation:spin 1s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pr{0%{transform:scale(1);opacity:.8}70%{transform:scale(2.5);opacity:0}100%{transform:scale(2.5);opacity:0}}
.emp{text-align:center;color:var(--green);font-size:12px;padding:12px 0}
.wrn{text-align:center;color:var(--yellow);font-size:11px;padding:8px 0}
.leaflet-popup-content-wrapper{background:var(--card);border:1px solid var(--border);color:#e2e8f0;border-radius:8px}
.leaflet-popup-tip{background:var(--card)}
.leaflet-popup-content{font-size:12px;line-height:1.4;margin:10px 14px}
.pt{font-weight:700;font-size:13px;color:#f1f5f9;margin-bottom:5px}
.pi{color:#94a3b8}.pi strong{color:var(--cyan)}
.pa{color:#fca5a5;font-weight:600;margin-top:4px}
</style>
</head>
<body>
<div class="hdr">
  <div>
    <h1>🔦 OTDR Aurora — NOC Arroba</h1>
    <div class="sub">Detecção: timestamp IXC + PON/VLAN | OLT → Backbone → Área → CTO</div>
  </div>
  <div class="tabs">
    <a href="index.html">📊 BGP</a>
    <a href="security.html">🛡️ Segurança</a>
    <a href="mapa-rede.html">🗺️ Mapa</a>
    <a href="otdr-rede.html">🔦 Geral</a>
    <a href="otdr-aurora.html" class="on">🔦 Aurora</a>
  </div>
</div>
<div id="map">
  <div class="painel">
    <div class="sec">
      <div class="sec-t">Status</div>
      <div class="kg">
        <div class="kp"><div class="l">CTOs</div><div class="v" id="k-ctos">—</div></div>
        <div class="kp"><div class="l">Offline</div><div class="v red" id="k-off">—</div></div>
        <div class="kp"><div class="l">Cli. online</div><div class="v green" id="k-on">—</div></div>
        <div class="kp"><div class="l">Cli. off</div><div class="v red" id="k-coff">—</div></div>
      </div>
    </div>
    <div class="sec">
      <div class="sec-t">Camadas</div>
      <label class="lr"><input type="checkbox" id="l-bb" checked><span class="ln" style="background:#f59e0b"></span>Backbone</label>
      <label class="lr"><input type="checkbox" id="l-rm" checked><span class="ln" style="background:#0ea5e9"></span>Ramais FTTH</label>
      <label class="lr"><input type="checkbox" id="l-ce" checked><span class="d" style="background:#f97316;border-radius:3px"></span>CEOs</label>
      <label class="lr"><input type="checkbox" id="l-ab" checked><span class="d" style="background:#a855f7;border-radius:3px"></span>Aberturas</label>
      <label class="lr"><input type="checkbox" id="l-ct" checked><span class="d" style="background:#22c55e"></span>CTOs</label>
      <label class="lr"><input type="checkbox" id="l-rp" checked><span class="d" style="background:#ef4444"></span>Rompimentos</label>
    </div>
    <div class="sec">
      <div class="sec-t">Rompimentos (IXC + PON)</div>
      <div id="r-list"><div class="wrn">Carregando IXC...</div></div>
    </div>
  </div>
  <div class="ld" id="ld"><div class="sp"></div><div id="ldt" style="font-size:12px;color:#94a3b8">Carregando...</div></div>
</div>
<script>
const API='https://manutencao-de-rede.vercel.app/api/rede';
const OLT={lat:-21.7797,lon:-41.3272};
const map=L.map('map',{zoomControl:true}).setView([-21.784,-41.331],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OSM',maxZoom:20}).addTo(map);
const L_={};
const setL=t=>document.getElementById('ldt').textContent=t;
const hideL=()=>document.getElementById('ld').style.display='none';
const dM=(a,b,c,d)=>{let R=6371000,la=(c-a)*Math.PI/180,lo=(d-b)*Math.PI/180,x=Math.sin(la/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(lo/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))};

async function boot(){
  setL('Topologia física...');
  let topo=await(await fetch('/parque-aurora.geojson')).json();
  let cabos=await(await fetch('/cabos-pa-aurora.geojson')).json();
  renderTopo(topo,cabos);

  setL('Dados IXC...');
  let api=await(await fetch(API)).json();

  setL('Analisando rompimentos...');
  renderCTOs(api);
  renderRomp(api,topo,cabos);
  setupToggles();
  hideL();
}

function renderTopo(topo,cabos){
  // Backbone
  L_.bb=L.layerGroup();
  let seen={};
  for(let f of topo.features.filter(f=>f.properties.tipo==='backbone')){
    let n=f.properties.nome,c=f.geometry.coordinates.map(c=>[c[1],c[0]]);
    let k=c[0][0].toFixed(5)+''+c[0][1].toFixed(5);
    if(seen[k])continue;seen[k]=1;
    let isBB=n.toUpperCase().includes('BACKBONE')&&!n.toUpperCase().includes('ÁREA');
    let cor=(n.match(/^F(\d+)/)||[])[1]?({F1:'#0055cc',F2:'#ff7700',F3:'#00aa00',F4:'#8B4513',F5:'#888',F6:'#ddd',F7:'#c00',F8:'#222',F9:'#dd0',F10:'#80c'}['F'+n.match(/F(\d+)/)[1]]||'#0ea5e9'):'#f59e0b';
    L.polyline(c,{color:cor,weight:isBB?3.5:2,opacity:.75}).bindPopup('<div class="pt">'+n+'</div><div class="pi">Tipo: <strong>'+(isBB?'Backbone':'Ramal')+'</strong></div>').addTo(L_.bb);
  }
  L_.bb.addTo(map);

  // Ramais
  L_.rm=L.layerGroup();
  for(let f of cabos.features){
    let n=f.properties.nome,cat=f.properties.categoria,c=f.geometry.coordinates.map(p=>[p[1],p[0]]);
    let cor,w,d;
    if(cat==='backbone_area'){cor='#f97316';w=2.5;d=null;}
    else if(cat==='ramal_area'){cor='#0ea5e9';w=1.5;d=null;}
    else if(cat==='ramal_mini'){cor='#22c55e';w=1;d='4,2';}
    else{cor='#475569';w=1;d='2,3';}
    let o={color:cor,weight:w,opacity:.5};if(d)o.dashArray=d;
    let p='<div class="pt">'+n+'</div><div class="pi">';
    if(f.properties.comprimento)p+='Comp: <strong>'+f.properties.comprimento+'m</strong><br>';
    if(f.properties.fibras)p+='Fibras: <strong>'+f.properties.fibras+'</strong><br>';
    p+='Cat: <strong>'+cat+'</strong></div>';
    L.polyline(c,o).bindPopup(p).addTo(L_.rm);
  }
  L_.rm.addTo(map);

  // CEOs
  L_.ce=L.layerGroup();
  for(let f of topo.features.filter(f=>f.properties.tipo==='caixa_emenda')){
    let lat=f.geometry.coordinates[1],lon=f.geometry.coordinates[0];
    let ic=L.divIcon({html:'<div style="background:#f97316;width:10px;height:10px;border-radius:2px;border:1.5px solid #fff"></div>',className:'',iconSize:[10,10],iconAnchor:[5,5]});
    L.marker([lat,lon],{icon:ic}).bindPopup('<div class="pt">📦 '+(f.properties.nome||'CEO')+'</div><div class="pi">Caixa de emenda</div>').addTo(L_.ce);
  }
  L_.ce.addTo(map);

  // Aberturas
  L_.ab=L.layerGroup();
  for(let f of topo.features.filter(f=>f.properties.tipo==='abertura_area')){
    let lat=f.geometry.coordinates[1],lon=f.geometry.coordinates[0];
    let ic=L.divIcon({html:'<div style="background:#a855f7;width:13px;height:13px;border-radius:3px;border:2px solid #fff"></div>',className:'',iconSize:[13,13],iconAnchor:[6,6]});
    L.marker([lat,lon],{icon:ic}).bindPopup('<div class="pt">📡 '+f.properties.nome+'</div><div class="pi">Abertura de área</div>').addTo(L_.ab);
  }
  L_.ab.addTo(map);
}

function renderCTOs(api){
  L_.ct=L.layerGroup();
  let tC=0,tOff=0,tOn=0,tCliOff=0;
  let ctos=api.ctos.filter(c=>c.lat&&c.lon&&(c.oltId==='77'||dM(OLT.lat,OLT.lon,c.lat,c.lon)<5000));
  for(let c of ctos){
    tC++;let hasOff=(c.offline||0)>0;if(hasOff)tOff++;
    tOn+=(c.online||0);tCliOff+=(c.offline||0);
    let cor=hasOff?'#ef4444':'#22c55e';
    let r=hasOff?6:4;if(c.rompimento)r=7;
    let m=L.circleMarker([c.lat,c.lon],{radius:r,color:cor,fillColor:cor,fillOpacity:.85,weight:c.rompimento?3:1.5});
    let p='<div class="pt">'+(hasOff?'🔴':'🟢')+' CTO '+c.id+'</div><div class="pi">On: <strong>'+(c.online||0)+'</strong> | Off: <strong>'+(c.offline||0)+'</strong>';
    if(c.oltNome)p+='<br>OLT: <strong>'+c.oltNome+'</strong>';
    p+='</div>';
    if(c.rompimento){
      let rp=c.rompimento;
      p+='<div class="pa">⚠️ ROMPIMENTO</div><div class="pi">PON: <strong>'+rp.pon+'</strong><br>Nível: <strong>'+(rp.nivel==='pon'?'BACKBONE':'CTO')+'</strong><br>Início: <strong>'+rp.inicio+'</strong><br>Delta: <strong>'+rp.delta_seg+'s</strong><br>Clientes: <strong>'+rp.n_clientes+'</strong></div>';
    }
    m.bindPopup(p).addTo(L_.ct);
  }
  L_.ct.addTo(map);
  document.getElementById('k-ctos').textContent=tC;
  document.getElementById('k-off').textContent=tOff;
  document.getElementById('k-on').textContent=tOn;
  document.getElementById('k-coff').textContent=tCliOff;
}

function renderRomp(api,topo,cabos){
  L_.rp=L.layerGroup();
  let romps=api.rompimentos||[];
  let ctosMap={};api.ctos.forEach(c=>{if(c.lat&&c.lon)ctosMap[c.id]=c;});

  // Filtrar rompimentos que afetam CTOs com coordenadas
  let relevant=[];
  for(let rp of romps){
    let ctoIds=rp.ctos.split(',').map(s=>s.trim());
    let coords=ctoIds.filter(id=>ctosMap[id]).map(id=>ctosMap[id]);
    if(coords.length>0)relevant.push({rp,coords,ctoIds});
  }

  let list=document.getElementById('r-list');
  if(relevant.length===0){
    list.innerHTML='<div class="emp">✅ Nenhum rompimento ativo</div>';
    L_.rp.addTo(map);
    return;
  }

  list.innerHTML='';

  for(let i=0;i<relevant.length;i++){
    let{rp,coords,ctoIds}=relevant[i];

    // Calcular ponto de ruptura
    let rLat,rLon,desc;
    if(rp.nivel==='pon'){
      // PON inteira → backbone antes da ramificação
      let sLat=0,sLon=0;coords.forEach(c=>{sLat+=c.lat;sLon+=c.lon;});
      let bLat=sLat/coords.length,bLon=sLon/coords.length;
      rLat=bLat+0.3*(OLT.lat-bLat);rLon=bLon+0.3*(OLT.lon-bLon);
      desc='Backbone antes da PON';
    }else{
      // CTO isolada → drop/ramal
      rLat=coords[0].lat;rLon=coords[0].lon;
      desc='Drop da CTO '+rp.cto_principal;
    }
    let distOLT=Math.round(dM(OLT.lat,OLT.lon,rLat,rLon));

    // Marcador no mapa
    let cor=rp.nivel==='pon'?'#ef4444':'#f97316';
    let tam=rp.nivel==='pon'?18:14;
    if(rp.nivel==='pon')L.polyline([[OLT.lat,OLT.lon],[rLat,rLon]],{color:'#ef4444',weight:2,dashArray:'6,4',opacity:.6}).addTo(L_.rp);
    let ic=L.divIcon({html:'<div style="position:relative;width:'+tam+'px;height:'+tam+'px"><div style="position:absolute;inset:0;border-radius:50%;background:'+cor+';opacity:.7;animation:pr 1.5s ease-out infinite"></div><div style="position:absolute;inset:'+(tam/4)+'px;border-radius:50%;background:'+cor+';border:2px solid #fff"></div></div>',className:'',iconSize:[tam,tam],iconAnchor:[tam/2,tam/2]});
    let pop='<div class="pt" style="color:'+cor+'">🔴 PON '+rp.pon+'</div><div class="pi">Nível: <strong>'+(rp.nivel==='pon'?'BACKBONE':'CTO/RAMAL')+'</strong><br>OLT: <strong>'+rp.oltNome+'</strong><br>CTOs: <strong>'+rp.ctos+'</strong><br>Clientes: <strong>'+rp.n_clientes+'</strong><br>Início: <strong>'+rp.inicio+'</strong><br>Delta: <strong>'+rp.delta_seg+'s</strong><br>Ponto: <strong>'+desc+'</strong><br>Dist. OLT: <strong>~'+distOLT+'m</strong></div>';
    L.marker([rLat,rLon],{icon:ic,zIndexOffset:1000}).bindPopup(pop).addTo(L_.rp);
    L.circle([rLat,rLon],{radius:rp.nivel==='pon'?150:60,color:cor,fillColor:cor,fillOpacity:.08,weight:1,dashArray:'4,4'}).addTo(L_.rp);
    // Anel nas CTOs afetadas
    coords.forEach(c=>{L.circleMarker([c.lat,c.lon],{radius:10,color:'#ef4444',fillColor:'#ef4444',fillOpacity:.15,weight:2,opacity:.8}).addTo(L_.rp);});

    // Card no painel
    let badge=rp.nivel==='pon?'<span class="rb pon">PON</span>':'<span class="rb cto">CTO</span>';
    let cliHtml='';
    if(rp.clientes&&rp.clientes.length>0){
      cliHtml='<div style="margin-top:6px"></div>';
      for(let cl of rp.clientes.slice(0,6)){
        cliHtml+='<div class="cl"><span class="lg">'+cl.login+'</span> | CTO '+cl.id_caixa+' | <span class="hr">'+(cl.ultima_conexao||'?')+'</span></div>';
      }
      if(rp.clientes.length>6)cliHtml+='<div class="cl" style="color:#475569">...+'+(rp.clientes.length-6)+'</div>';
    }
    let acao=rp.nivel==='pon?
      '1. Acionar equipe AGORA<br>2. Verificar alarme OLT (PON LOS)<br>3. Inspecionar backbone ~'+distOLT+'m da OLT<br>4. SLA: <strong>2h</strong>':
      '1. Verificar CTO '+rp.cto_principal+'<br>2. Testar drop/ramal<br>3. Confirmar fibra vs energia<br>4. SLA: <strong>4h</strong>';

    let card=document.createElement('div');
    card.className='rc';
    card.innerHTML='<div class="rh" onclick="this.nextElementSibling.classList.toggle(\'open\')"><div class="rt">PON '+rp.pon+' — '+rp.oltNome+badge+'</div><div class="rsub">'+rp.n_clientes+' clientes | '+rp.delta_seg+'s | '+rp.inicio+'</div></div><div class="rb2'+(i===0?' open':'')+'"><div class="ir"><span class="il">Nível</span><span class="iv">'+(rp.nivel==='pon'?'PON (backbone)':'CTO (drop)')+'</span></div><div class="ir"><span class="il">CTOs</span><span class="iv red">'+rp.ctos+'</span></div><div class="ir"><span class="il">Clientes</span><span class="iv red">'+rp.n_clientes+'</span></div><div class="ir"><span class="il">Início</span><span class="iv cy">'+rp.inicio+'</span></div><div class="ir"><span class="il">Delta</span><span class="iv">'+rp.delta_seg+'s</span></div><div class="ir"><span class="il">Ponto</span><span class="iv">'+desc+'</span></div><div class="ir"><span class="il">Dist. OLT</span><span class="iv cy">~'+distOLT+'m</span></div><div class="ax">📋 <strong>Ação:</strong><br>'+acao+'</div><button class="bl" onclick="map.setView(['+rLat+','+rLon+'],16)">📍 Centralizar</button>'+cliHtml+'</div>';
    list.appendChild(card);
  }
  L_.rp.addTo(map);
}

function setupToggles(){
  let m={'l-bb':L_.bb,'l-rm':L_.rm,'l-ce':L_.ce,'l-ab':L_.ab,'l-ct':L_.ct,'l-rp':L_.rp};
  for(let id in m){(function(lid,l){let el=document.getElementById(lid);if(el)el.addEventListener('change',function(){this.checked?map.addLayer(l):map.removeLayer(l);});})(id,m[id]);}
}

boot().catch(e=>{document.getElementById('ldt').textContent='Erro: '+e.message;console.error(e);});
</script>
</body>
</html>
