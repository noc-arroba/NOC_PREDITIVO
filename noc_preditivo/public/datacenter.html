<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOC Preditivo — Datacenters e Racks</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#02040a;--pn:rgba(10,18,38,.72);--pn2:rgba(14,26,54,.6);--bd:rgba(56,189,248,.16);--tx:#e6f1ff;--mu:#6b84a8;--ok:#22f5a0;--wn:#ffb020;--bad:#ff4d6d;--ac:#38e1ff;--ac2:#8b5cf6}
html{background:var(--bg)}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--tx);font-size:13px;min-height:100vh;
 background:
  radial-gradient(1100px 520px at 12% -8%,rgba(56,225,255,.13),transparent 60%),
  radial-gradient(900px 520px at 100% 0%,rgba(139,92,246,.14),transparent 55%),
  linear-gradient(rgba(56,225,255,.045) 1px,transparent 1px) 0 0/44px 44px,
  linear-gradient(90deg,rgba(56,225,255,.045) 1px,transparent 1px) 0 0/44px 44px,var(--bg);background-attachment:fixed}
.header{padding:14px 24px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(8,16,36,.92),rgba(8,16,36,.55));backdrop-filter:blur(8px);position:relative}
.header:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);opacity:.7}
.header h1{font-size:19px;letter-spacing:.5px;font-weight:700;background:linear-gradient(90deg,#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
.header .asn{font-size:11px;color:var(--mu);margin-top:3px;letter-spacing:.3px}
.clock{font-family:Consolas,'Courier New',monospace;font-size:21px;color:var(--ac);text-shadow:0 0 14px rgba(56,225,255,.55);letter-spacing:2px;font-variant-numeric:tabular-nums}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
.nav{display:flex;gap:4px;background:var(--pn);border-radius:10px;padding:4px;border:1px solid var(--bd);flex-wrap:wrap;margin-bottom:14px;width:fit-content;backdrop-filter:blur(8px)}
.nav a{text-decoration:none;padding:6px 13px;border-radius:7px;font-size:12px;color:#8fa6c6;transition:.15s}
.nav a.active{background:linear-gradient(135deg,rgba(56,225,255,.22),rgba(139,92,246,.28));color:#fff;font-weight:600;box-shadow:0 0 16px rgba(56,225,255,.28) inset,0 0 0 1px rgba(56,225,255,.4)}
.nav a:not(.active):hover{background:rgba(56,225,255,.08);color:#dff6ff}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.crumb{color:var(--mu);font-size:12px;letter-spacing:.3px}.crumb a{color:var(--ac);cursor:pointer;text-decoration:none}.crumb a:hover{text-shadow:0 0 10px var(--ac)}
.btn{background:linear-gradient(135deg,rgba(56,225,255,.2),rgba(139,92,246,.25));color:#eaf8ff;border:1px solid rgba(56,225,255,.45);border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;transition:.15s}
.btn:hover{box-shadow:0 0 18px rgba(56,225,255,.4);transform:translateY(-1px)}
.btn.sec{background:var(--pn2);border-color:var(--bd);color:#9fb6d6}.btn.del{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.5);color:#ffc2cd}
.sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{position:relative;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;backdrop-filter:blur(8px);overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ac),var(--ac2))}
.kpi .v{font-size:28px;font-weight:700;font-family:Consolas,monospace;color:#fff;text-shadow:0 0 18px rgba(56,225,255,.45)}.kpi .l{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1.2px;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{position:relative;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;cursor:pointer;backdrop-filter:blur(8px);transition:.18s;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));opacity:.9}
.card:hover{transform:translateY(-3px);border-color:rgba(56,225,255,.6);box-shadow:0 10px 34px rgba(56,225,255,.16)}
.card.vazio{opacity:.62}.card.vazio:before{background:#334155}
.card h3{font-size:15px;margin:3px 0;letter-spacing:.3px}.card .k{font-size:10px;color:var(--ac);text-transform:uppercase;letter-spacing:1.2px}
.card .n{display:flex;gap:18px;margin-top:12px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}.card .n b{color:#fff;font-size:20px;display:block;font-family:Consolas,monospace;text-shadow:0 0 12px rgba(56,225,255,.4)}
.sel{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(100,116,139,.25);color:#a9b8cf;margin-left:6px;vertical-align:middle;letter-spacing:.6px;border:1px solid rgba(255,255,255,.07)}
.sel.Importado{background:rgba(56,225,255,.12);color:#8ceaff;border-color:rgba(56,225,255,.4)}.sel.Manual{background:rgba(139,92,246,.18);color:#d4c4ff;border-color:rgba(139,92,246,.5)}
.sel.Real,.sel.Confirmado{background:rgba(34,245,160,.12);color:#7dffc8;border-color:rgba(34,245,160,.45)}.sel.Inferido{background:rgba(255,176,32,.12);color:#ffd27a;border-color:rgba(255,176,32,.45)}
.sel.Simulado{background:rgba(100,116,139,.2)}.sel.Desatualizado{background:rgba(255,77,109,.15);color:#ffb3c0;border-color:rgba(255,77,109,.5)}
.racks{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.rackbox{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;width:100%;max-width:500px;flex:0 1 500px;backdrop-filter:blur(8px)}
.rackbox h3{font-size:15px;margin-bottom:2px;letter-spacing:.3px}.rackbox .sub{font-size:11px;color:var(--mu);margin-bottom:10px}
/* gabinete */
.cab{position:relative;padding:10px 14px;border-radius:8px;background:linear-gradient(90deg,#0a0f1d,#111a30 8%,#111a30 92%,#0a0f1d);border:1px solid #25365a;box-shadow:0 0 0 1px #000 inset,0 12px 40px rgba(0,0,0,.55),0 0 38px rgba(56,225,255,.08)}
.cab:before,.cab:after{content:"";position:absolute;top:8px;bottom:8px;width:8px;background:repeating-linear-gradient(180deg,#1b2a48 0 9px,#0a1124 9px 17px);border-radius:2px;opacity:.9}
.cab:before{left:3px}.cab:after{right:3px}
.rack{background:#03060d;border:1px solid #1a2744;border-radius:3px;box-shadow:0 0 0 1px #000 inset}
.u{display:flex;height:22px;border-bottom:1px solid rgba(56,225,255,.06);font-size:10px;align-items:stretch}
.u:nth-child(odd){background:rgba(255,255,255,.012)}
.u .no{width:26px;color:#3f5578;text-align:right;padding-right:6px;line-height:22px;font-family:Consolas,monospace;font-size:10px;user-select:none}
.u .sl{flex:1;position:relative}
.dev{position:absolute;left:2px;right:2px;border-radius:3px;padding:0 10px 0 22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px;font-weight:600;cursor:pointer;z-index:2;color:#fff;text-shadow:0 1px 2px #000a;
 border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -2px 6px rgba(0,0,0,.45),0 1px 6px rgba(0,0,0,.6);transition:.15s}
.dev:hover{filter:brightness(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 18px rgba(56,225,255,.55);z-index:5}
.dev:before{content:"";position:absolute;left:7px;top:50%;margin-top:-3px;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok),0 0 2px #fff;animation:pulse 2.2s infinite}
.dev:after{content:"";position:absolute;right:6px;top:3px;bottom:3px;width:46px;opacity:.28;background:repeating-linear-gradient(90deg,#000 0 2px,transparent 2px 5px);border-radius:1px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.r-Router{background:linear-gradient(180deg,#0f9bbf,#0a5f7d)}.r-OLT{background:linear-gradient(180deg,#8452f0,#4c2a9e)}.r-Switch{background:linear-gradient(180deg,#19b36a,#0d6b40)}
.r-Org{background:repeating-linear-gradient(90deg,#1c2740 0 6px,#141d33 6px 12px);color:#7d92b3;font-weight:500}.r-Org:before{background:#475a7c;box-shadow:none;animation:none}.r-Org:after{display:none}
.r-Outro{background:linear-gradient(180deg,#d9731f,#8a430e)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:10px;color:var(--mu);margin-top:10px;letter-spacing:.4px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.leg i.r-Router{background:#0f9bbf}.leg i.r-OLT{background:#8452f0}.leg i.r-Switch{background:#19b36a}.leg i.r-Org{background:#26324e}.leg i.r-Outro{background:#d9731f}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:14px;backdrop-filter:blur(8px)}.panel h3{font-size:11px;color:var(--ac);text-transform:uppercase;letter-spacing:1.6px;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid rgba(56,225,255,.08);font-size:12px}th{color:var(--mu);font-size:10px;text-transform:uppercase;letter-spacing:1px}tr.cl{cursor:pointer;transition:.12s}tr.cl:hover{background:rgba(56,225,255,.07)}
.alert{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.4);color:#ffd27a;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.mdl{position:fixed;inset:0;background:rgba(1,3,10,.78);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}.mdl.on{display:flex}
.mbox{background:linear-gradient(160deg,rgba(14,26,54,.97),rgba(8,14,32,.97));border:1px solid rgba(56,225,255,.4);border-radius:16px;max-width:660px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 0 60px rgba(56,225,255,.18),0 30px 80px rgba(0,0,0,.7)}
.mbox h3{font-size:17px;margin-bottom:8px}.x{float:right;cursor:pointer;color:var(--mu);font-size:24px;line-height:1}.x:hover{color:var(--ac)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:block;font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.9px;margin-bottom:3px}.f .w{grid-column:1/-1}
.f input,.f select,.f textarea{width:100%;background:rgba(3,8,20,.8);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;color:var(--tx);font-size:12px;font-family:inherit}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 12px rgba(56,225,255,.3)}
.det dt{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-top:10px}.det dd{font-size:13px}
.msg{font-size:12px;margin-top:8px;color:#ffb3c0}.msg.ok{color:#7dffc8}
.foot{text-align:center;color:#3a4d6e;font-size:11px;padding:18px;letter-spacing:.5px}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}.f{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
  <div><h1>🏢 Datacenters e Racks</h1><div class="asn">AS264025 — Arroba Banda Larga · cadastro do painel (não altera equipamentos)</div></div>
  <div class="clock" id="clock">--:--:--</div>
</div>
<div class="wrap">
  <div class="nav">
    <a href="index.html">📊 Executivo</a><a href="bgp-centro.html">BGP</a><a href="zabbix.html">Zabbix</a>
    <a href="flow.html">Flow</a><a href="sites.html">🌐 Sites</a><a href="datacenter.html" class="active">🏢 Datacenters</a><a href="rb-cliente.html">RB Cliente</a>
    <a href="security.html">Segurança</a><a href="config.html">Config</a>
  </div>
  <div class="bar"><div class="crumb" id="crumb"></div><div class="sp"></div>
    <button class="btn sec" id="bkey">🔑 Modo edição</button><span id="edtag" class="sel Manual" style="display:none">EDIÇÃO ATIVA</span>
    <button class="btn" id="badd" style="display:none"></button></div>
  <div id="main"><div style="color:var(--mu);padding:20px">Carregando...</div></div>
  <div class="foot" id="foot"></div>
</div>
<div class="mdl" id="mdl"><div class="mbox"><span class="x" id="mx">&times;</span><div id="mbody"></div></div></div>
<script>
const API='https://valen-a789b7cc.base44.app/functions/dcMonitor',EDIT='https://valen-a789b7cc.base44.app/functions/dcEdit';
const $=id=>document.getElementById(id);
let D=null,DC=null,RK=null,KEY=sessionStorage.getItem('dckey')||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SELOS=['Manual','Importado','Real','Confirmado','Inferido','Simulado','Desatualizado'];
const sel=s=>`<span class="sel ${esc(s||'')}">${esc(s||'Sem selo')}</span>`;
function cls(d){const r=(d.device_role||'').toLowerCase();if(r.includes('organiz'))return'r-Org';if(r.includes('olt'))return'r-OLT';if(r.includes('router')||r.includes('roteador'))return'r-Router';if(r.includes('switch'))return'r-Switch';return'r-Outro';}
function ed(){return !!KEY}
function chrome(){$('edtag').style.display=ed()?'inline-block':'none';$('bkey').textContent=ed()?'🔓 Sair da edição':'🔑 Modo edição';}
function crumb(){let h='<a data-go="home">Datacenters</a>';if(DC)h+=` › <a data-go="dc">${esc(DC.name)}</a>`;if(RK)h+=` › ${esc(RK.name)}`;$('crumb').innerHTML=h;
  document.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{if(a.dataset.go==='home'){DC=RK=null;}else if(a.dataset.go==='dc'){RK=null;}render();});
  const b=$('badd');b.style.display=ed()?'inline-block':'none';b.textContent=!DC?'+ Datacenter':!RK?'+ Rack':'+ Equipamento';
  b.onclick=()=>!DC?formDC():!RK?formRack():formAsset();}
function render(){if(!D)return;
  if(DC)DC=D.datacenters.find(x=>x.id===DC.id)||null;if(DC&&RK)RK=DC.racks.find(x=>x.id===RK.id)||null;
  chrome();crumb();
  if(!DC)home();else if(!RK)dcView();else rackView();
  $('foot').textContent='Gerado em '+new Date(D.generated_at).toLocaleString('pt-BR')+' · '+D.source;}
function home(){const ds=D.datacenters,nr=ds.reduce((a,d)=>a+d.racks.length,0),nd=ds.reduce((a,d)=>a+d.racks.reduce((b,r)=>b+r.devices.length,0),0);
  let h=`<div class="kpis"><div class="kpi"><div class="v">${ds.length}</div><div class="l">Datacenters / POPs</div></div><div class="kpi"><div class="v">${nr}</div><div class="l">Racks</div></div><div class="kpi"><div class="v">${nd}</div><div class="l">Equipamentos em rack</div></div><div class="kpi"><div class="v" style="color:${D.unracked.length?'var(--wn)':'var(--ok)'}">${D.unracked.length}</div><div class="l">Sem rack definido</div></div></div><div class="grid">`;
  h+=ds.slice().sort((a,b)=>b.racks.length-a.racks.length||a.name.localeCompare(b.name)).map(d=>{const n=d.racks.reduce((b,r)=>b+r.devices.length,0);
    return`<div class="card ${d.racks.length?'':'vazio'}" data-dc="${d.id}"><div class="k">${esc(d.kind||'')}${sel(d.data_source)}</div><h3>${esc(d.name)}</h3><div style="font-size:11px;color:var(--mu)">${esc(d.description||'')}</div><div class="n"><div><b>${d.racks.length}</b>racks</div><div><b>${n}</b>equipamentos</div></div></div>`}).join('')+'</div>';
  if(D.unracked.length)h+=`<div class="panel"><h3>Equipamentos sem rack (${D.unracked.length})</h3><table><tr><th>Nome</th><th>IP</th><th>Função</th><th>POP</th><th>Selo</th></tr>${D.unracked.map(a=>`<tr class="cl" data-as="${a.id}"><td>${esc(a.name)}</td><td>${esc(a.ip_address||'--')}</td><td>${esc(a.device_role||'--')}</td><td>${esc(a.pop||'--')}</td><td>${sel(a.data_source)}</td></tr>`).join('')}</table></div>`;
  $('main').innerHTML=h;document.querySelectorAll('[data-dc]').forEach(c=>c.onclick=()=>{DC=D.datacenters.find(x=>x.id===c.dataset.dc);render();});bindAs();}
function dcView(){let h=`<div class="panel" style="margin-top:0"><h3>${esc(DC.name)} ${sel(DC.data_source)}</h3><dl class="det"><dd>${esc(DC.description||'')}</dd>${DC.address?`<dt>Endereço</dt><dd>${esc(DC.address)}</dd>`:''}${DC.power_info?`<dt>Energia</dt><dd>${esc(DC.power_info)}</dd>`:''}${DC.cooling_info?`<dt>Climatização</dt><dd>${esc(DC.cooling_info)}</dd>`:''}${DC.responsible?`<dt>Responsável</dt><dd>${esc(DC.responsible)}</dd>`:''}${DC.source_ref?`<dt>Origem</dt><dd>${esc(DC.source_ref)}</dd>`:''}</dl>${ed()?`<div style="margin-top:10px"><button class="btn sec" id="bedc">Editar</button> <button class="btn del" id="bddc">Excluir</button></div>`:''}</div>`;
  if(!DC.racks.length)h+='<div class="panel"><div style="color:var(--mu)">Nenhum rack documentado neste local.'+(ed()?' Use "+ Rack".':' Ative o modo edição para cadastrar.')+'</div></div>';
  h+='<div class="racks" style="margin-top:12px">'+DC.racks.map(rackHtml).join('')+'</div>';
  $('main').innerHTML=h;document.querySelectorAll('[data-rk]').forEach(c=>c.onclick=e=>{if(e.target.closest('.dev'))return;RK=DC.racks.find(x=>x.id===c.dataset.rk);render();});bindAs();
  if($('bedc'))$('bedc').onclick=()=>formDC(DC);if($('bddc'))$('bddc').onclick=()=>del('datacenter',DC.id,'o datacenter '+DC.name,()=>{DC=null;});}
function rackHtml(r){const n=r.size_u||44;const bs=!!r.back_side;let lin='';
  const devs=r.devices.filter(d=>d.rack_position_u>0&&d.rack_size_u>0);
  for(let i=n;i>=1;i--){const d=devs.find(x=>x.rack_position_u===i);
    lin+=`<div class="u"><div class="no">${i}</div><div class="sl">${d?`<div class="dev ${cls(d)}" data-as="${d.id}" style="top:${-(d.rack_size_u-1)*22+1}px;height:${d.rack_size_u*22-3}px;line-height:${d.rack_size_u*22-3}px" title="${esc(d.name)} (${d.rack_size_u}U)">${esc(d.name)}${d.ip_address?' · '+esc(d.ip_address):''}</div>`:''}</div></div>`;}
  const sem=r.devices.filter(d=>!(d.rack_position_u>0&&d.rack_size_u>0));
  return`<div class="rackbox" data-rk="${r.id}" style="cursor:pointer"><h3>${esc(r.name)} ${sel(r.data_source)}</h3><div class="sub">${n} U · ${r.devices.length} equipamento(s)${bs?' · numeração do verso':''} ${r.description?'· '+esc(r.description):''}</div><div class="cab"><div class="rack">${lin}</div></div>${sem.length?`<div class="alert" style="margin-top:8px">${sem.length} equipamento(s) sem posição definida: ${sem.map(d=>esc(d.name)).join(', ')}</div>`:''}<div class="leg"><span><i class="r-Router"></i>Roteador</span><span><i class="r-OLT"></i>OLT</span><span><i class="r-Switch"></i>Switch</span><span><i class="r-Org"></i>Organizador</span><span><i class="r-Outro"></i>Outro</span></div></div>`;}
function rackView(){let h=`<div class="racks">${rackHtml(RK)}</div><div class="panel"><h3>Equipamentos do rack</h3><table><tr><th>U</th><th>Nome</th><th>IP</th><th>Função</th><th>Fabricante / modelo</th><th>Selo</th></tr>${RK.devices.slice().sort((a,b)=>(b.rack_position_u||0)-(a.rack_position_u||0)).map(a=>`<tr class="cl" data-as="${a.id}"><td>${a.rack_position_u||'--'}${a.rack_size_u>1?'–'+(a.rack_position_u+a.rack_size_u-1):''}</td><td>${esc(a.name)}</td><td>${esc(a.ip_address||'--')}</td><td>${esc(a.device_role||'--')}</td><td>${esc([a.manufacturer,a.model].filter(Boolean).join(' ')||'--')}</td><td>${sel(a.data_source)}</td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mu)">Rack vazio.</td></tr>'}</table>${ed()?`<div style="margin-top:10px"><button class="btn sec" id="berk">Editar rack</button> <button class="btn del" id="bdrk">Excluir rack</button></div>`:''}</div>`;
  $('main').innerHTML=h;bindAs();if($('berk'))$('berk').onclick=()=>formRack(RK);if($('bdrk'))$('bdrk').onclick=()=>del('rack',RK.id,'o rack '+RK.name,()=>{RK=null;});}
function allAssets(){const l=[...D.unracked];D.datacenters.forEach(d=>d.racks.forEach(r=>l.push(...r.devices)));return l;}
function bindAs(){document.querySelectorAll('[data-as]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();const a=allAssets().find(x=>x.id===e.dataset.as);if(a)detalhe(a);});}
function detalhe(a){const l=[['IP',a.ip_address],['Função',a.device_role],['Fabricante',a.manufacturer],['Modelo',a.model],['Firmware',a.firmware_version],['Nº de série',a.serial_number],['POP',a.pop],['Local',a.location],['Rack',a.rack_name],['Posição',a.rack_position_u?`U${a.rack_position_u}${a.rack_size_u>1?'–U'+(a.rack_position_u+a.rack_size_u-1):''} (${a.rack_size_u||1}U, ${a.rack_side||'frente'})`:null],['Latitude / longitude',a.latitude!=null?a.latitude+' / '+a.longitude:null],['Porta/range de acesso',a.access_port_range],['Range de IP',a.ip_query_range],['Range de VLAN',a.vlan_query_range],['Range de interface',a.interface_query_range],['ASN',a.asn],['Observações',a.notes||a.description]].filter(x=>x[1]);
  $('mbody').innerHTML=`<h3>${esc(a.name)} ${sel(a.data_source)}</h3><dl class="det">${l.map(x=>`<dt>${x[0]}</dt><dd>${esc(x[1])}</dd>`).join('')}</dl><div style="font-size:11px;color:var(--mu);margin-top:10px">Usuário e senha não são exibidos aqui.</div>${ed()?`<div style="margin-top:10px"><button class="btn sec" id="bea">Editar</button> <button class="btn del" id="bda">Excluir</button></div>`:''}`;
  $('mdl').classList.add('on');if($('bea'))$('bea').onclick=()=>formAsset(a);if($('bda'))$('bda').onclick=()=>del('asset',a.id,'o equipamento '+a.name,()=>{});}
function fechar(){$('mdl').classList.remove('on');}$('mx').onclick=fechar;$('mdl').onclick=e=>{if(e.target.id==='mdl')fechar();};
function fld(n,l,v,t,w,o){const val=v==null?'':v;if(t==='sel')return`<div class="${w?'w':''}"><label>${l}</label><select name="${n}">${o.map(x=>`<option value="${esc(x[0])}" ${String(x[0])===String(val)?'selected':''}>${esc(x[1])}</option>`).join('')}</select></div>`;
  if(t==='ta')return`<div class="w"><label>${l}</label><textarea name="${n}" rows="2">${esc(val)}</textarea></div>`;
  return`<div class="${w?'w':''}"><label>${l}</label><input name="${n}" type="${t||'text'}" value="${esc(val)}" ${t==='number'?'step="any"':''}></div>`;}
function modalForm(titulo,campos,onSave,extra){$('mbody').innerHTML=`<h3>${titulo}</h3><form id="fm"><div class="f">${campos}</div><div id="fmsg" class="msg"></div><div style="margin-top:12px"><button class="btn" type="submit">Salvar</button> <button class="btn sec" type="button" id="bc">Cancelar</button></div></form>${extra||''}`;
  $('mdl').classList.add('on');$('bc').onclick=fechar;
  $('fm').onsubmit=async e=>{e.preventDefault();const o={};new FormData($('fm')).forEach((v,k)=>{o[k]=v});await onSave(o);};}
async function api(body){const r=await fetch(EDIT,{method:'POST',headers:{'Content-Type':'application/json','x-edit-key':KEY},body:JSON.stringify(body)});const j=await r.json();if(r.status===401){KEY='';sessionStorage.removeItem('dckey');chrome();throw new Error('Chave de edição inválida.');}if(!r.ok)throw new Error(j.error+(j.missing?': '+j.missing.join(', '):''));return j;}
async function salvar(entity,id,data,numeros){numeros.forEach(k=>{if(data[k]===''||data[k]==null)delete data[k];else data[k]=Number(data[k]);});if(data.back_side!==undefined)data.back_side=data.back_side==='true';
  const m=$('fmsg');m.className='msg';m.textContent='Salvando...';try{await api({action:id?'update':'create',entity,id,data});m.className='msg ok';m.textContent='Salvo.';await load();setTimeout(fechar,500);}catch(e){m.className='msg';m.textContent=e.message;}}
function formDC(d){d=d||{};modalForm(d.id?'Editar datacenter':'Novo datacenter',fld('name','Nome *',d.name,'text',1)+fld('kind','Tipo',d.kind||'Datacenter','sel',0,['Datacenter','POP','Predio NOC','Outro'].map(x=>[x,x]))+fld('data_source','Selo de origem',d.data_source||'Manual','sel',0,SELOS.map(x=>[x,x]))+fld('address','Endereço',d.address,'text',1)+fld('latitude','Latitude',d.latitude,'number')+fld('longitude','Longitude',d.longitude,'number')+fld('responsible','Responsável',d.responsible,'text',1)+fld('power_info','Energia (nobreak, gerador, circuitos)',d.power_info,'ta')+fld('cooling_info','Climatização',d.cooling_info,'ta')+fld('description','Descrição',d.description,'ta'),o=>salvar('datacenter',d.id,o,['latitude','longitude']));}
function formRack(r){r=r||{};const dcs=D.datacenters.map(x=>[x.id,x.name]);modalForm(r.id?'Editar rack':'Novo rack',fld('datacenter_id','Datacenter *',r.datacenter_id||(DC&&DC.id),'sel',1,dcs)+fld('name','Nome *',r.name,'text',1)+fld('size_u','Altura (U) *',r.size_u||44,'number')+fld('back_side','Numeração do verso',String(!!r.back_side),'sel',0,[['false','Não'],['true','Sim']])+fld('row_label','Fileira/posição na sala',r.row_label,'text')+fld('max_power_w','Potência máx. (W)',r.max_power_w,'number')+fld('data_source','Selo de origem',r.data_source||'Manual','sel',1,SELOS.map(x=>[x,x]))+fld('description','Descrição',r.description,'ta'),o=>{o.datacenter_name=(D.datacenters.find(x=>x.id===o.datacenter_id)||{}).name;return salvar('rack',r.id,o,['size_u','max_power_w']);});}
function formAsset(a){a=a||{};const rk=[['','(sem rack)']];D.datacenters.forEach(d=>d.racks.forEach(r=>rk.push([r.id,d.name+' › '+r.name])));
  const extra='<div style="font-size:11px;color:var(--mu);margin-top:10px">Equipamento novo exige: nome, POP, latitude, longitude, usuário e porta/range de acesso. A senha não é guardada aqui: informe só uma referência (ex.: nome do cofre). Este cadastro não conecta no equipamento.</div>';
  modalForm(a.id?'Editar equipamento':'Novo equipamento',fld('name','Nome *',a.name,'text',1)+fld('pop','POP *',a.pop||(DC&&DC.name),'text')+fld('device_role','Função',a.device_role,'text')+fld('ip_address','IP',a.ip_address,'text')+fld('access_port_range','Porta/range de acesso *',a.access_port_range,'text')+fld('latitude','Latitude *',a.latitude,'number')+fld('longitude','Longitude *',a.longitude,'number')+fld('username','Usuário *',a.username,'text')+fld('password_ref','Referência da senha (não a senha)',a.password_ref,'text')+fld('manufacturer','Fabricante',a.manufacturer,'text')+fld('model','Modelo',a.model,'text')+fld('serial_number','Nº de série',a.serial_number,'text')+fld('firmware_version','Firmware',a.firmware_version,'text')+fld('rack_id','Rack',a.rack_id||(RK&&RK.id)||'','sel',1,rk)+fld('rack_position_u','U inicial (base)',a.rack_position_u,'number')+fld('rack_size_u','Altura (U)',a.rack_size_u||1,'number')+fld('rack_side','Lado',a.rack_side||'frente','sel',0,[['frente','Frente'],['verso','Verso']])+fld('data_source','Selo de origem',a.data_source||'Manual','sel',0,SELOS.map(x=>[x,x]))+fld('ip_query_range','Range de IP',a.ip_query_range,'text')+fld('vlan_query_range','Range de VLAN',a.vlan_query_range,'text')+fld('interface_query_range','Range de interface',a.interface_query_range,'text')+fld('notes','Observações',a.notes,'ta'),
   o=>{const r=D.datacenters.flatMap(d=>d.racks).find(x=>x.id===o.rack_id);o.rack_name=r?r.name:'';if(!r){o.rack_id='';}
     const conflito=r&&o.rack_position_u?r.devices.find(x=>x.id!==a.id&&x.rack_position_u&&!(Number(o.rack_position_u)+Number(o.rack_size_u||1)-1<x.rack_position_u||Number(o.rack_position_u)>x.rack_position_u+x.rack_size_u-1)):null;
     if(conflito){$('fmsg').textContent='Conflito de posição com "'+conflito.name+'" (U'+conflito.rack_position_u+').';return;}
     if(a.id){['username','password_ref'].forEach(k=>{if(o[k]==='')delete o[k];});}
     return salvar('asset',a.id,o,['latitude','longitude','rack_position_u','rack_size_u']);},extra);}
async function del(entity,id,nome,depois){if(!confirm('Excluir '+nome+'? Isso só remove do cadastro do painel.'))return;try{await api({action:'delete',entity,id});depois();fechar();await load();}catch(e){alert(e.message);}}
$('bkey').onclick=()=>{if(ed()){KEY='';sessionStorage.removeItem('dckey');render();return;}const k=prompt('Chave de edição:');if(k){KEY=k.trim();sessionStorage.setItem('dckey',KEY);render();}};
async function load(){try{const r=await fetch(API);D=await r.json();if(D.error)throw new Error(D.error);render();}catch(e){$('main').innerHTML='<div class="alert">Falha ao carregar: '+esc(e.message)+'</div>';}}
setInterval(()=>{$('clock').textContent=new Date().toLocaleTimeString('pt-BR');},1000);
load();
</script>
</body>
</html>
